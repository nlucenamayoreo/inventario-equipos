async_workers: []
storage_buckets: []
realtime:
  enabled: false
scheduled_jobs: []
database_objects:
  naming_map: database/naming-map.json
  generation_report: database/generation-report.json
environment_variables:
  backend:
  - ENVIRONMENT
  - SERVICE_NAME
  - LOG_LEVEL
  - DB_SECRET_NAME
  - DB_NAME
  - DB_PROXY_ENDPOINT
  - DB_PORT
  - DB_SSLMODE
  - ALLOWED_ORIGINS
  frontend:
  - VITE_API_BASE_URL
  - VITE_COGNITO_USER_POOL_ID
  - VITE_COGNITO_CLIENT_ID
  - VITE_COGNITO_DOMAIN
  - VITE_APP_EXPOSURE
  - VITE_REALTIME_ENABLED
authorization_rules:
- table: '*'
  policy: Permisos por rol configurable (tbl_rol_permiso); el grupo admin_ti y el rol Superadministrador tienen
    todos; sin operador solo lectura
  command: INSERT/UPDATE/DELETE
  roles:
  - admin_ti
  using: null
  with_check: null
  enforced_in: application.use_cases.common.require(principal, permiso) en cada caso de uso de escritura; el principal
    se completa en ResolveOperadorUseCase
structural_changes:
- 'Endpoints agrupados en una Lambda por módulo (sesion, catalogos, usuarios, activos) con despacho por ruta: 10
  usuarios sin concurrencia, menos arranques en frío.'
- 'Contrato REST de docs/API.md sin el prefijo /api: la URL base es la del stage de API Gateway (VITE_API_BASE_URL).'
- 'Errores en el formato estándar {error: {code, title, message, details}}; las reglas de negocio responden 422.'
- 'Roles y permisos en la base (tbl_rol, tbl_rol_permiso, tbl_operador) en lugar de grupos de Cognito: se administran
  desde la aplicación; Cognito solo autentica e invita.'
- 'Cargas masivas: el navegador lee el machote .xlsx y envía las filas en JSON; el backend valida fila por fila
  (savepoint) y aplica todo o nada.'
incompatibilities: []
migration_risks:
- 'Sincronización con Google Workspace (docs/INTEGRACION_GOOGLE_WORKSPACE.md) pendiente: el estado se lee de sync_google_log
  pero el job aún no existe.'
pending_errors: []
