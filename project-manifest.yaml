version: 1
kind: greenfield
draft: false
project:
  name: Inventario de Equipos TI
  slug: inventario
  compania: may
  label: INVENTARIO
  exposure: internal
  public_reason: ''
source:
  framework: vite
  language: ts
  router: react-router
  monolith: false
  schema_source: database/source
target:
  aws_region: us-west-2
  api_endpoint_type: REGIONAL
  frontend_hosting: amplify-static
  lambda:
    memory: 512
    timeout: 30
    architecture: x86_64
  cognito:
    groups:
    - admin_ti
    - consulta
  database:
    engine: aurora-postgresql
    rls_mode: backend
modules:
