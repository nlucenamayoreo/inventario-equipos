  - CreateSiloUseCase
  - ListDepartamentosUseCase
  - CreateDepartamentoUseCase
  - ListTiposEquipoUseCase
  - CreateTipoEquipoUseCase
  - ListArticulosUseCase
  - CreateArticuloUseCase
  - ListCargosUseCase
  - CreateCargoUseCase
  - UpdateDotacionUseCase
  - UpdateTipoEquipoUseCase
  - ListMarcasUseCase
  - CreateMarcaUseCase
  - UpdateMarcaUseCase
  - ListModelosUseCase
  - CreateModeloUseCase
  - UpdateModeloUseCase
  - ListCaracteristicasUseCase
  - CreateCaracteristicaUseCase
  - UpdateCaracteristicaUseCase
- name: usuarios
  entities:
  - usuario
  - vacacion
  use_cases:
  - ListUsuariosUseCase
  - CreateUsuarioUseCase
  - UpdateUsuarioUseCase
  - DeleteUsuarioUseCase
  - RegisterVacacionesUseCase
  - FinishVacacionesUseCase
  - DeactivateUsuarioUseCase
  - ReactivateUsuarioUseCase
- name: activos
  entities:
  - activo
  - activo_movimiento
  use_cases:
  - ListActivosUseCase
  - CreateActivoUseCase
  - AssignActivoUseCase
  - ReleaseActivoUseCase
  - ChangeActivoEstadoUseCase
  - ListMovimientosUseCase
- name: seguridad
  entities:
  - permiso
  - rol
  - rol_permiso
  - operador
  use_cases:
  - ListPermisosUseCase
  - ListRolesUseCase
  - CreateRolUseCase
  - UpdateRolUseCase
  - ListOperadoresUseCase
  - InviteOperadorUseCase
  - UpdateOperadorUseCase
- name: reasignaciones
