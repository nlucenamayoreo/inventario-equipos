version = 0.1

[dev.build.parameters]
cached = true
parallel = true

[dev.deploy.parameters]
stack_name = "dev-inventario-api"
region = "us-west-2"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
s3_prefix = "dev-inventario-api"
parameter_overrides = [
  "Environment=dev",
  "VpcSubnetIds=/dev/inventario/network/subnets",
  "LambdaSecurityGroupId=/dev/inventario/network/lambda-sg",
  "DbProxyEndpoint=/dev/inventario/db/proxy-endpoint",
  "DbSecretName=/dev/inventario/db/app",
  "DbName=may_dev_inventario_db",
  "AllowedOrigins=/dev/inventario/frontend/origin",
]
tags = [
  "Project=INVENTARIO",
  "Environment=DEV",
  "Name=dev-inventario-api",
]

[qa.build.parameters]
cached = true
parallel = true

[qa.deploy.parameters]
stack_name = "qa-inventario-api"
region = "us-west-2"
confirm_changeset = true
