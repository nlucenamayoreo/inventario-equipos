  "DbProxyEndpoint=/qa/inventario/db/proxy-endpoint",
  "DbSecretName=/qa/inventario/db/app",
  "DbName=may_qa_inventario_db",
  "AllowedOrigins=/qa/inventario/frontend/origin",
]
tags = [
  "Project=INVENTARIO",
  "Environment=QA",
  "Name=qa-inventario-api",
]

[prod.build.parameters]
