      Description: INVENTARIO - SESION_API | GET /me, GET /sync-google/estado
      Handler: entrypoints.lambda_handlers.sesion.handler
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref 'SesionApiLogGroup'
      Events:
        GetMe:
          Type: Api
          Properties:
            RestApiId: !Ref 'Api'
            Path: /me
            Method: get
        GetSyncGoogleEstado:
          Type: Api
          Properties:
            RestApiId: !Ref 'Api'
            Path: /sync-google/estado
            Method: get
      Role: !GetAtt 'DbRole.Arn'
  SesionApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-sesion-api-errors'
      AlarmDescription: INVENTARIO - errores en SesionApiFunction
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Threshold: 1
      Period: 300
      Statistic: Sum
      TreatMissingData: notBreaching
      AlarmActions: !If
      - HasAlarmTopic
      - - !Ref 'AlarmTopicArn'
      - !Ref 'AWS::NoValue'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
      - Name: FunctionName
        Value: !Ref 'SesionApiFunction'
