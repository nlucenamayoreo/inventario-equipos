      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
      - Name: FunctionName
        Value: !Ref 'ImportacionesApiFunction'
  DbRole:
    Type: AWS::IAM::Role
    Properties:
      Description: 'INVENTARIO - rol compartido por 4 función(es): db'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: least-privilege
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: WriteOwnLogs
            Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
            - !GetAtt 'ActivosApiLogGroup.Arn'
            - !GetAtt 'CatalogosApiLogGroup.Arn'
            - !GetAtt 'ImportacionesApiLogGroup.Arn'
            - !GetAtt 'ReasignacionesApiLogGroup.Arn'
            - !GetAtt 'SesionApiLogGroup.Arn'
            - !GetAtt 'UsuariosApiLogGroup.Arn'
          - Sid: VpcNetworkInterfaces
            Effect: Allow
            Action:
            - ec2:CreateNetworkInterface
            - ec2:DescribeNetworkInterfaces
            - ec2:DeleteNetworkInterface
            - ec2:AssignPrivateIpAddresses
            - ec2:UnassignPrivateIpAddresses
            Resource: '*'
          - Sid: ReadDbSecret
            Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DbSecretName}-??????'
  CognitoAdminDbRole:
    Type: AWS::IAM::Role
    Properties:
      Description: 'INVENTARIO - rol compartido por 1 función(es): cognito_admin, db'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: least-privilege
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: WriteOwnLogs
            Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
            - !GetAtt 'SeguridadApiLogGroup.Arn'
          - Sid: VpcNetworkInterfaces
            Effect: Allow
            Action:
            - ec2:CreateNetworkInterface
            - ec2:DescribeNetworkInterfaces
            - ec2:DeleteNetworkInterface
            - ec2:AssignPrivateIpAddresses
            - ec2:UnassignPrivateIpAddresses
            Resource: '*'
          - Sid: ReadDbSecret
            Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DbSecretName}-??????'
          - Sid: CognitoAdmin
            Effect: Allow
            Action:
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminUpdateUserAttributes
            - cognito-idp:AdminDisableUser
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:AdminRemoveUserFromGroup
            Resource: !If
            - CreateUserPool
            - !GetAtt 'UserPool.Arn'
            - !Ref 'CognitoUserPoolArn'
Outputs:
  UserPoolId:
    Condition: CreateUserPool
    Value: !Ref 'UserPool'
    Description: COGNITO_USER_POOL_ID del frontend
  UserPoolClientId:
    Condition: CreateUserPool
    Value: !Ref 'UserPoolClient'
    Description: COGNITO_CLIENT_ID del frontend
  ApiUrl:
    Description: URL base del API (VITE_/NEXT_PUBLIC_/REACT_APP_API_BASE_URL)
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
